const ScrollReveal = ({ children, baseOpacity = 0.1, enableBlur = true, baseRotation = 3, blurStrength = 4, className = "" }) => {
  const [isVisible, setIsVisible] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); }
    }, { threshold: 0.2, rootMargin: "0px 0px -20px 0px" });
    if (ref.current) observer.observe(ref.current);
    return () => { if (ref.current) observer.unobserve(ref.current); };
  }, []);

  const text = typeof children === 'string' ? children : '';
  const words = text.split(" ");
  return (
    <p ref={ref} className={`flex flex-wrap gap-x-[0.25em] ${className}`}>
      {words.map((word, i) => (
        <span key={i} className="inline-block transition-all duration-[800ms] ease-[cubic-bezier(0.16,1,0.3,1)]"
          style={{
            opacity: isVisible ? 1 : baseOpacity,
            filter: isVisible ? 'blur(0px)' : (enableBlur ? `blur(${blurStrength}px)` : 'none'),
            transform: isVisible ? 'translateY(0) rotate(0)' : `translateY(12px) rotate(${baseRotation}deg)`,
            transitionDelay: `${i * 0.03}s`
          }}
        >
          {word}
        </span>
      ))}
    </p>
  );
};

const Reveal = ({ children, delay = 0, className = "" }) => {
  const [isVisible, setIsVisible] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); }
    }, { threshold: 0.1 });
    if (ref.current) observer.observe(ref.current);
    return () => { if (ref.current) observer.unobserve(ref.current); };
  }, []);
  return (
    <div ref={ref} className={`transition-all duration-[1000ms] ease-[cubic-bezier(0.16,1,0.3,1)] ${isVisible ? "opacity-100 translate-y-0 blur-none scale-100" : "opacity-0 translate-y-12 blur-[4px] scale-[0.98]"} ${className}`} style={{ transitionDelay: `${delay}s` }}>
      {children}
    </div>
  );
};

const Typewriter = ({ words, typingSpeed = 100, deletingSpeed = 50, delay = 2000 }) => {
  const [text, setText] = useState('');
  const [wordIndex, setWordIndex] = useState(0);
  const [isDeleting, setIsDeleting] = useState(false);
  useEffect(() => {
    const currentWord = words[wordIndex] || "";
    let timer;
    if (isDeleting) {
      timer = setTimeout(() => {
        setText(currentWord.substring(0, text.length - 1));
        if (text.length === 0) { setIsDeleting(false); setWordIndex((prev) => (prev + 1) % words.length); }
      }, deletingSpeed);
    } else {
      timer = setTimeout(() => {
        setText(currentWord.substring(0, text.length + 1));
        if (text.length === currentWord.length) setTimeout(() => setIsDeleting(true), delay);
      }, typingSpeed);
    }
    return () => clearTimeout(timer);
  }, [text, isDeleting, wordIndex, words, typingSpeed, deletingSpeed, delay]);
  return <span className="border-r-2 border-amber-500 pr-1 cursor-blink text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-600 font-display">{text}</span>;
};

  const dropzoneRef = useRef(null);
  
  const [isEmbedPlayer, setIsEmbedPlayer] = useState(false);
  const [embedVideoUrl, setEmbedVideoUrl] = useState('');

  // Mode Embed Player Check
  useEffect(() => {
    const path = window.location.pathname;
    if (path.startsWith('/player/')) {
      setIsEmbedPlayer(true);
      const parts = path.split('/');
      if (parts.length >= 5) {
        const uId = parts[2];
        const fName = parts.slice(4).join('/');
        setEmbedVideoUrl(`/${uId}/media/${fName}`);
      }
    } else {
      if (currentUser) syncWithServer();
      const hash = window.location.hash.slice(1);
      if (['dashboard', 'upload', 'history'].includes(hash)) setActiveTab(hash);
    }
  }, [currentUser]);

  // Drag & Drop
  useEffect(() => {
    if (isEmbedPlayer) return;
    const dz = dropzoneRef.current;
    if (!dz) return;
    const handleDragOver = (e) => { e.preventDefault(); setIsDragOver(true); };
    const handleDragLeave = (e) => { e.preventDefault(); setIsDragOver(false); };
    const handleDrop = (e) => {
      e.preventDefault();
      setIsDragOver(false);
      if (e.dataTransfer.files.length > 0) {
        setSelectedFile(e.dataTransfer.files[0]);
        setUploadState('selected');
      }
    };
    dz.addEventListener('dragover', handleDragOver);
    dz.addEventListener('dragleave', handleDragLeave);
    dz.addEventListener('drop', handleDrop);
    return () => {
      dz.removeEventListener('dragover', handleDragOver);
      dz.removeEventListener('dragleave', handleDragLeave);
      dz.removeEventListener('drop', handleDrop);
    };
  }, [activeTab, isEmbedPlayer]);

  const syncWithServer = async () => {
    if (!currentUser) return;
    setIsLoading(true);
    try {
      const res = await fetch(`${API_BASE}/${currentUser}.json`);
      if (res.ok) {
        const json = await res.json();
        const serverFiles = (json.files || []).map(f => ({
          id: f.id,
          name: f.original_name || f.name,
          url: f.fix_url || f.user_media_url || `${window.location.origin}/${currentUser}/media/${encodeURIComponent(f.original_name || f.name)}`,
          rawUrl: f.url || f.public_url,
          size: f.file_size || f.size || 0,
          type: f.mime_type || f.type || 'application/octet-stream',
          uploaded_at: f.uploaded_at,
          file_type: f.file_type,
          evo_data: f.evo_data
        }));
        setFiles(serverFiles);
        localStorage.setItem('ins_unlimited', JSON.stringify(serverFiles));
      }
    } catch (e) {
      console.error("Sync error:", e);
      showToast("Gagal sinkronisasi");
    } finally {
      setIsLoading(false);
    }
  };

  const showToast = (msg) => {
    setToast({ show: true, msg });
    setTimeout(() => setToast({ show: false, msg: '' }), 2500);
  };

  const copyToClipboard = (text) => {
    navigator.clipboard.writeText(text);
    showToast("Link Tersalin!");
  };

  const copyPlayerLink = (userId, fileName) => {
    const link = `${window.location.origin}/player/${userId}/media/${encodeURIComponent(fileName)}`;
    copyToClipboard(link);
  };

  const handleTabSwitch = (tab) => {
    if (tab === 'upload' && !currentUser) {
      setPendingTab(tab);
      setShowLoginModal(true);
      return;
    }
    setActiveTab(tab);
    window.location.hash = tab;
  };

  const handleLoginSubmit = (e) => {
    e.preventDefault();
    if (inputUsername.trim()) {
      const u = inputUsername.trim().toLowerCase();
      setCurrentUser(u);
      localStorage.setItem('ins_username', u);
      setShowLoginModal(false);
      if (pendingTab) {
        setActiveTab(pendingTab);
        window.location.hash = pendingTab;
        setPendingTab('');
      }
    }
  };

  const handleLogout = () => {
    setCurrentUser('');
    setFiles([]);
    localStorage.removeItem('ins_username');
    localStorage.removeItem('ins_unlimited');
    setActiveTab('dashboard');
    window.location.hash = 'dashboard';
    showToast("Logout Berhasil");
  };

  const handleFileSelect = (e) => {
    if (e.target.files.length > 0) {
      setSelectedFile(e.target.files[0]);
      setUploadState('selected');
    }
  };

  const startUpload = () => {
    if (!selectedFile || !currentUser) return;
    setUploadState('uploading');
    const formData = new FormData();
    formData.append("file", selectedFile);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${API_BASE}/upload-send`);
    xhr.setRequestHeader("x-user-id", currentUser);
    xhr.setRequestHeader("x-filename", selectedFile.name);

    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable) setUploadProgress(Math.round((ev.loaded / ev.total) * 100));
    };

    xhr.onload = async () => {
      if (xhr.status === 200) {
        try {
          const res = JSON.parse(xhr.responseText);
          if (res.success) {
            await syncWithServer();
            setUploadedUrls({
              public: res.public_url || res.url,
              fix: res.fix_url || res.user_media_url,
              player: `${window.location.origin}/player/${currentUser}/media/${encodeURIComponent(res.filename)}`
            });
            setUploadState('success');
            showToast("File Tersimpan!");
          } else {
            throw new Error(res.error || "Upload gagal");
          }
        } catch (err) {
          setUploadState('idle');
          showToast(err.message || "Gagal upload");
        }
      } else {
        setUploadState('idle');
        showToast("Gagal upload");
      }
    };
    xhr.onerror = () => { setUploadState('idle'); showToast("Error jaringan"); };
    xhr.send(formData);
  };

  const deleteFile = async (fileId) => {
    const updated = files.filter(f => f.id !== fileId);
    setFiles(updated);
    localStorage.setItem('ins_unlimited', JSON.stringify(updated));
    showToast("File dihapus");
  };

  const formatSize = (b) => {
    if (!b || b === 0) return '0 B';
    const i = Math.floor(Math.log(b) / Math.log(1024));
    return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B','KB','MB','GB'][i];
  };

  const formatDate = (dateStr) => {
    if (!dateStr) return '-';
    const d = new Date(dateStr);
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  };

  const clearHistory = () => {
    if (window.confirm('Hapus cache lokal? Server aman.')) {
      setFiles([]);
      localStorage.setItem('ins_unlimited', '[]');
      showToast('Cache dibersihkan');
    }
  };

  const isVideo = (mime) => mime?.startsWith('video/');
  const isImage = (mime) => mime?.startsWith('image/');
  const isAudio = (mime) => mime?.startsWith('audio/');

  const totalSize = files.reduce((acc, f) => acc + (f.size || 0), 0);

  const filteredFiles = files.filter(f => {
    const matchesSearch = (f.name || '').toLowerCase().includes(searchQuery.toLowerCase());
    const matchesType = filterType === 'all' || f.file_type === filterType;
    return matchesSearch && matchesType;
  });

  // Dedicated Fullscreen Embed Video Player
  const DedicatedEmbedPlayer = ({ src }) => {
    return (
      <div className="fixed inset-0 bg-black flex items-center justify-center z-[9999]">
        <video src={src} controls autoPlay playsInline className="w-full h-full max-h-screen object-contain outline-none" />
      </div>
    );
  };

  if (isEmbedPlayer) {
    if (!embedVideoUrl) return <div className="text-white p-4">Invalid Player URL</div>;
    return <DedicatedEmbedPlayer src={embedVideoUrl} />;
  }

  // --- MODAL & PLAYER COMPONENTS ---
  const CustomVideoPlayer = ({ file, onClose }) => {
    const videoRef = useRef(null);
    const containerRef = useRef(null);
    const [isPlaying, setIsPlaying] = useState(false);
    const [currentTime, setCurrentTime] = useState(0);
    const [duration, setDuration] = useState(0);
    const [volume, setVolume] = useState(1);
    const [isMuted, setIsMuted] = useState(false);
    const [isFullscreen, setIsFullscreen] = useState(false);
    const [showControls, setShowControls] = useState(true);
    const [playbackRate, setPlaybackRate] = useState(1);
    const controlsTimeoutRef = useRef(null);
    const [isDragging, setIsDragging] = useState(false);

    useEffect(() => {
      const video = videoRef.current;
      if (!video) return;
      const updateTime = () => setCurrentTime(video.currentTime);
      const updateDuration = () => setDuration(video.duration);
      const onEnded = () => setIsPlaying(false);
      video.addEventListener('timeupdate', updateTime);
      video.addEventListener('loadedmetadata', updateDuration);
      video.addEventListener('ended', onEnded);
      return () => {
        video.removeEventListener('timeupdate', updateTime);
        video.removeEventListener('loadedmetadata', updateDuration);
        video.removeEventListener('ended', onEnded);
      };
    }, []);

    const togglePlay = () => {
      const video = videoRef.current;
      if (!video) return;
      if (video.paused) { video.play(); setIsPlaying(true); }
      else { video.pause(); setIsPlaying(false); }
    };

    const handleSeek = (e) => {
      const video = videoRef.current;
      if (!video || !duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * duration;
    };

    const toggleMute = () => {
      const video = videoRef.current;
      if (!video) return;
      video.muted = !video.muted;
      setIsMuted(video.muted);
    };

    const handleVolumeChange = (e) => {
      const video = videoRef.current;
      if (!video) return;
      const val = parseFloat(e.target.value);
      video.volume = val;
      setVolume(val);
      if (val > 0 && video.muted) { video.muted = false; setIsMuted(false); }
    };

    const toggleFullscreen = () => {
      const container = containerRef.current;
      if (!container) return;
      if (!document.fullscreenElement) {
        container.requestFullscreen().then(() => setIsFullscreen(true)).catch(() => {});
      } else {
        document.exitFullscreen().then(() => setIsFullscreen(false)).catch(() => {});
      }
    };

    const handleMouseMove = () => {
      setShowControls(true);
      if (controlsTimeoutRef.current) clearTimeout(controlsTimeoutRef.current);
      controlsTimeoutRef.current = setTimeout(() => { if (isPlaying) setShowControls(false); }, 3000);
    };

    const formatTime = (seconds) => {
      if (!seconds || isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    };

    const changePlaybackRate = () => {
      const rates = [0.5, 0.75, 1, 1.25, 1.5, 2];
      const nextRate = rates[(rates.indexOf(playbackRate) + 1) % rates.length];
      if (videoRef.current) videoRef.current.playbackRate = nextRate;
      setPlaybackRate(nextRate);
    };

    const skip = (seconds) => {
      if (videoRef.current) videoRef.current.currentTime = Math.max(0, Math.min(videoRef.current.currentTime + seconds, duration));
    };

    return (
      <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/95 backdrop-blur-xl animate-scale-in" onClick={onClose}>
        <div ref={containerRef} className="relative w-full max-w-6xl bg-black rounded-[2.5rem] overflow-hidden shadow-[0_0_80px_rgba(251,191,36,0.1)] border border-white/10" onClick={(e) => e.stopPropagation()} onMouseMove={handleMouseMove}>
          <div className="video-container" style={{ borderRadius: '2.5rem' }}>
            <video ref={videoRef} src={file.url} className="w-full" style={{ maxHeight: '70vh', objectFit: 'contain' }} onClick={togglePlay} preload="metadata" playsInline />
            <div className="absolute top-4 right-4 bg-black/70 backdrop-blur-md px-3 py-1 rounded-md text-[10px] font-bold text-amber-500 border border-amber-500/30 z-20">
              {formatSize(file.size)} • {file.type?.split('/')[1]?.toUpperCase() || 'VIDEO'}
            </div>

            <div className={`video-controls-overlay ${showControls ? 'show-controls' : ''}`} style={{ opacity: showControls ? 1 : 0 }}>
              <div className="progress-bar" onClick={handleSeek} onMouseDown={() => setIsDragging(true)} onMouseUp={() => setIsDragging(false)}>
                <div className="progress-fill" style={{ width: `${duration ? (currentTime / duration) * 100 : 0}%` }}></div>
                <div className="progress-handle" style={{ left: `${duration ? (currentTime / duration) * 100 : 0}%`, opacity: isDragging ? 1 : undefined }}></div>
              </div>

              <div className="flex items-center gap-2 md:gap-4">
                <button className="control-btn" onClick={togglePlay}>{isPlaying ? <Pause size={20} /> : <Play size={20} />}</button>
                <button className="control-btn" onClick={() => skip(-10)}><SkipBack size={18} /></button>
                <button className="control-btn" onClick={() => skip(10)}><SkipForward size={18} /></button>
                <button className="control-btn hidden sm:flex" onClick={toggleMute}>{isMuted ? <VolumeX size={18} /> : <Volume2 size={18} />}</button>
                <input type="range" min="0" max="1" step="0.1" value={isMuted ? 0 : volume} onChange={handleVolumeChange} className="volume-slider hidden sm:block" />
                <span className="time-display">{formatTime(currentTime)} / {formatTime(duration)}</span>
                <button className="control-btn ml-auto" onClick={changePlaybackRate} style={{ fontSize: '11px', fontWeight: 'bold', fontFamily: 'var(--font-display)' }}>{playbackRate}x</button>
                <button className="control-btn" onClick={toggleFullscreen}>{isFullscreen ? <Minimize size={18} /> : <Maximize size={18} />}</button>
              </div>
            </div>
          </div>

          <div className="absolute top-6 left-6 bg-black/50 backdrop-blur-md px-4 py-2 rounded-full text-xs md:text-sm text-zinc-300 font-display flex items-center gap-2 max-w-[60%] truncate border border-white/10 z-50">
            <Film size={14} className="text-amber-500 shrink-0" /> <span className="truncate">{file.name}</span>
          </div>

          <button onClick={onClose} className="absolute top-6 right-6 p-3 bg-black/50 hover:bg-red-500 rounded-full text-white backdrop-blur-md transition-all border border-white/10 hover:border-transparent z-50">
            <X size={20} />
          </button>
        </div>
      </div>
    );
  };

  const ImageViewer = ({ file, onClose }) => {
    const [scale, setScale] = useState(1);
    const [rotation, setRotation] = useState(0);
    const [position, setPosition] = useState({ x: 0, y: 0 });
    const [isDragging, setIsDragging] = useState(false);
    const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

    const zoomIn = () => setScale(s => Math.min(s + 0.25, 4));
    const zoomOut = () => setScale(s => Math.max(s - 0.25, 0.5));
    const rotate = () => setRotation(r => r + 90);
    const reset = () => { setScale(1); setRotation(0); setPosition({ x: 0, y: 0 }); };

    const handleMouseDown = (e) => {
      if (scale > 1) { setIsDragging(true); setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y }); }
    };
    const handleMouseMove = (e) => {
      if (!isDragging) return; setPosition({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
    };

    return (
      <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 md:p-6 bg-black/95 backdrop-blur-xl animate-scale-in" onClick={onClose}>
        <div className="relative max-w-6xl w-full max-h-[90vh] rounded-[2.5rem] overflow-hidden shadow-[0_0_80px_rgba(251,191,36,0.1)] border border-white/10 bg-black/50 p-2" onClick={(e) => e.stopPropagation()}>
          <img src={file.url} className="max-w-full w-full max-h-[85vh] object-contain rounded-[2rem] cursor-move" alt={file.name}
            style={{ transform: `translate(${position.x}px, ${position.y}px) scale(${scale}) rotate(${rotation}deg)`, transition: isDragging ? 'none' : 'transform 0.3s cubic-bezier(0.16,1,0.3,1)' }}
            onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={() => setIsDragging(false)} onMouseLeave={() => setIsDragging(false)} draggable={false}
          />
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-black/50 backdrop-blur-md px-4 py-2 md:px-6 md:py-3 rounded-full text-xs md:text-sm text-zinc-300 font-display flex items-center gap-2 md:gap-4 w-max max-w-[80%] truncate border border-white/10">
            <ImageIcon size={14} className="text-amber-500 shrink-0" />
            <span className="truncate">{file.name} &mdash; {formatSize(file.size)}</span>
          </div>
          <div className="absolute top-6 right-6 flex flex-wrap justify-end gap-2 max-w-[200px]">
            <button onClick={zoomIn} className="p-2 md:p-2.5 bg-black/50 hover:bg-amber-500 rounded-xl text-white hover:text-black transition-all backdrop-blur-md border border-white/10"><ZoomIn size={16} /></button>
            <button onClick={zoomOut} className="p-2 md:p-2.5 bg-black/50 hover:bg-amber-500 rounded-xl text-white hover:text-black transition-all backdrop-blur-md border border-white/10"><ZoomOut size={16} /></button>
            <button onClick={rotate} className="p-2 md:p-2.5 bg-black/50 hover:bg-amber-500 rounded-xl text-white hover:text-black transition-all backdrop-blur-md border border-white/10"><RotateCcw size={16} /></button>
            <button onClick={reset} className="p-2 md:p-2.5 bg-black/50 hover:bg-amber-500 rounded-xl text-white hover:text-black transition-all backdrop-blur-md border border-white/10"><RefreshCw size={16} /></button>
            <button onClick={onClose} className="p-2 md:p-2.5 bg-black/50 hover:bg-red-500 rounded-xl text-white transition-all backdrop-blur-md border border-white/10"><X size={16} /></button>
          </div>
        </div>
      </div>
    );
  };

  const AudioPlayer = ({ file, onClose }) => {
    return (
      <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/95 backdrop-blur-xl animate-scale-in" onClick={onClose}>
        <div className="relative bg-zinc-900 rounded-[2.5rem] overflow-hidden shadow-[0_0_80px_rgba(251,191,36,0.1)] border border-zinc-800 w-full max-w-lg p-8 md:p-12 flex flex-col items-center gap-8" onClick={(e) => e.stopPropagation()}>
          <div className="w-24 h-24 bg-amber-500/10 rounded-full flex items-center justify-center border border-amber-500/30 relative shrink-0">
            <div className="absolute inset-0 bg-amber-500/20 rounded-full animate-pulse"></div>
            <Music size={32} className="text-amber-500 relative z-10" />
          </div>
          <h3 className="text-xl md:text-2xl font-display font-black text-white text-center truncate w-full">{file.name}</h3>
          <audio src={file.url} autoPlay controls className="w-full custom-audio" />
          <button onClick={onClose} className="absolute top-6 right-6 p-3 bg-black/50 hover:bg-red-500 rounded-full text-white backdrop-blur-md transition-all border border-white/10 hover:border-transparent">
            <X size={20} />
          </button>
        </div>
      </div>
    );
  };

  const FileBadge = ({ type }) => {
    return <span className={`badge-type ${type === 'video' ? 'text-red-400' : type === 'image' ? 'text-blue-400' : type === 'audio' ? 'text-green-400' : 'text-zinc-400'}`}>{type}</span>;
  };

  // --- RENDER APP ---
  return (
    <div className="min-h-screen flex flex-col lg:flex-row bg-[#050505] text-[#fafafa] relative overflow-hidden">
      
      {/* Background Orbs */}
      <div className="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-amber-600/10 rounded-full blur-[120px] pointer-events-none animate-blob"></div>
      <div className="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-orange-600/10 rounded-full blur-[100px] pointer-events-none animate-blob" style={{ animationDelay: '3s' }}></div>

      {/* TOAST */}
      <div className={`fixed top-8 left-1/2 -translate-x-1/2 z-[200] glass px-6 py-3 rounded-full border border-amber-500/30 text-amber-500 font-bold shadow-[0_10px_40px_rgba(251,191,36,0.15)] flex items-center gap-3 transition-all duration-400 ${toast.show ? 'scale-100 opacity-100 translate-y-0' : 'scale-95 opacity-0 -translate-y-4 pointer-events-none'}`}>
        <CheckCircle2 size={20} />
        <span className="font-display tracking-wide text-sm">{toast.msg}</span>
      </div>

      {/* LOGIN MODAL */}
      {showLoginModal && (
        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl">
          <div className="glass rounded-[2.5rem] p-8 w-full max-w-md border border-amber-500/20 shadow-[0_0_80px_rgba(251,191,36,0.1)] animate-scale-in relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent opacity-50"></div>
            <button onClick={() => setShowLoginModal(false)} className="absolute top-6 right-6 text-zinc-500 hover:text-white transition-colors"><X size={24} /></button>
            <div className="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-center mb-6 text-amber-500 mx-auto relative group shrink-0">
              <div className="absolute inset-0 bg-amber-500/20 blur-xl rounded-full group-hover:scale-150 transition-transform"></div>
              <LogIn size={32} className="relative z-10" />
            </div>
            <h3 className="text-3xl font-display font-black text-center mb-2 tracking-tighter">Otorisasi Akses</h3>
            <p className="text-zinc-400 text-center text-sm mb-8 font-medium leading-relaxed">Masukkan ID Database Anda untuk mulai mengunggah file ke cloud.</p>
            <form onSubmit={handleLoginSubmit} className="flex flex-col gap-5">
              <div className="relative group">
                <User size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 group-focus-within:text-amber-500 transition-colors" />
                <input type="text" autoFocus required placeholder="Misal: ins_sanjaya" value={inputUsername} onChange={(e) => setInputUsername(e.target.value)}
                  className="w-full bg-black/50 border border-zinc-800 rounded-2xl py-4 pl-12 pr-4 text-white font-bold placeholder:text-zinc-700 focus:outline-none focus:border-amber-500/50 focus:bg-zinc-900/50 transition-all font-display tracking-wide" />
              </div>
              <button type="submit" className="relative overflow-hidden w-full bg-amber-500 text-black py-4 rounded-2xl font-display font-black text-sm uppercase tracking-widest transition-all hover:scale-[1.02] active:scale-[0.98] shadow-[0_0_20px_rgba(251,191,36,0.2)]">
                <div className="animate-shimmer"></div>
                <span className="relative z-10">Masuk / Buat ID</span>
              </button>
            </form>
          </div>
        </div>
      )}

      {/* SIDEBAR (Desktop & Mobile: Top/Vertical Header) */}
      <aside className="w-full lg:w-72 glass border-b lg:border-b-0 lg:border-r border-zinc-900/50 p-6 lg:p-8 flex flex-col gap-8 lg:gap-10 z-20 relative">
        
        {/* Brand */}
        <div className="flex items-center gap-4">
          <Reveal delay={0}>
            <div className="relative shrink-0">
              <div className="absolute inset-0 bg-amber-500/30 blur-xl rounded-full"></div>
              <div className="w-12 h-12 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center shadow-xl relative z-10">
                <InfinityIcon size={28} className="text-black" />
              </div>
            </div>
          </Reveal>
          <Reveal delay={0.1}>
            <div className="min-w-0">
              <span className="block text-2xl font-display font-black tracking-tighter leading-none truncate">INS CLOUD</span>
              <span className="text-[10px] text-amber-500 font-bold tracking-[0.2em] uppercase font-display truncate block">{currentUser ? `USER: ${currentUser}` : "Guest Mode"}</span>
            </div>
          </Reveal>
        </div>

        {/* Navigation */}
        <nav className="flex flex-col gap-2 w-full flex-1">
          {[
            { id: 'dashboard', icon: LayoutGrid, label: 'Dashboard' },
            { id: 'upload', icon: CloudUpload, label: 'Upload' },
            { id: 'history', icon: FolderSearch, label: 'My Files' }
          ].map((item, i) => (
            <Reveal key={item.id} delay={0.1 + (i * 0.1)} className="w-full">
              <button onClick={() => handleTabSwitch(item.id)}
                className={`w-full flex items-center justify-start gap-4 px-5 py-4 rounded-2xl transition-all font-semibold font-display tracking-wide text-base ${activeTab === item.id ? 'bg-amber-400 text-black shadow-[0_0_24px_rgba(251,191,36,0.15)]' : 'text-zinc-400 hover:text-white hover:bg-white/5'}`}
              >
                <item.icon size={20} className="shrink-0" />
                <span>{item.label}</span>
              </button>
            </Reveal>
          ))}
        </nav>

        {/* Status */}
        <div className="mt-auto pt-4">

                            {isVideo(file.type) ? <Film size={16} className="text-red-400" /> :
                             isImage(file.type) ? <ImageIcon size={16} className="text-blue-400" /> :
                             isAudio(file.type) ? <Music size={16} className="text-green-400" /> :
                             <FileText size={16} className="text-zinc-500" />}
                          </div>
                          <div className="flex-1 min-w-0">
                            <h4 className="font-semibold text-xs md:text-sm truncate text-zinc-200">{file.name}</h4>
                            <div className="flex flex-wrap items-center gap-2 text-[9px] md:text-[10px] text-zinc-500 mt-1">
                              <span>{formatSize(file.size)}</span> <span className="hidden sm:inline">•</span> <span>{formatDate(file.uploaded_at)}</span>
                            </div>
                          </div>
                        </div>
                        <div className="flex gap-2 self-end sm:self-center bg-zinc-900/50 p-1.5 rounded-xl border border-zinc-800">
                          {isVideo(file.type) && (
                            <button onClick={(e) => { e.stopPropagation(); copyPlayerLink(currentUser, file.name); }} className="p-2 bg-blue-500/10 rounded-lg text-blue-400 hover:bg-blue-500 hover:text-white transition-all">
                              <Film size={14} />
                            </button>
                          )}
                          <button onClick={(e) => { e.stopPropagation(); copyToClipboard(file.url); }} className="p-2 bg-zinc-800 rounded-lg text-zinc-400 hover:text-amber-500 transition-all">
                            <Copy size={14} />
                          </button>
                          <button onClick={(e) => { e.stopPropagation(); window.open(file.url, '_blank'); }} className="p-2 bg-zinc-800 rounded-lg text-zinc-400 hover:text-white transition-all">
                            <ExternalLink size={14} />
                          </button>
                          <button onClick={(e) => { e.stopPropagation(); deleteFile(file.id); }} className="p-2 bg-zinc-800 rounded-lg text-zinc-400 hover:text-red-500 transition-all">
                            <Trash2 size={14} />
                          </button>
                        </div>
                      </div>
                    </Reveal>
                  ))}
                </div>
              )
            ) : (
              <Reveal delay={0.2}>
                <div className="py-24 text-center glass rounded-[2.5rem] border border-zinc-900 relative overflow-hidden">
                  <div className="absolute inset-0 bg-gradient-to-b from-zinc-900/20 to-transparent"></div>
                  <div className="w-20 h-20 bg-black/50 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-6 border border-zinc-800 relative z-10 shadow-inner shrink-0">
                    <Inbox size={32} className="text-zinc-600" />
                  </div>
                  <h3 className="text-2xl font-display font-black text-zinc-500 uppercase tracking-tighter relative z-10">Library Kosong</h3>
                  <p className="text-zinc-600 text-sm font-medium mt-2 relative z-10">Mulai unggah media pertama Anda ke cloud.</p>
                </div>
              </Reveal>
            )}
          </section>
        )}
      </main>

      {/* MEDIA MODALS */}
      {activeMedia && isImage(activeMedia.type) && <ImageViewer file={activeMedia} onClose={() => setActiveMedia(null)} />}
      {activeMedia && isVideo(activeMedia.type) && <CustomVideoPlayer file={activeMedia} onClose={() => setActiveMedia(null)} />}
      {activeMedia && isAudio(activeMedia.type) && <AudioPlayer file={activeMedia} onClose={() => setActiveMedia(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
