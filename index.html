<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INS CLOUD - Unlimited Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{--font-body:'Inter',sans-serif;--font-display:'Space Grotesk',sans-serif;--amber:#fbbf24;--amber-dark:#d97706}
  *{font-family:var(--font-body);margin:0;padding:0;box-sizing:border-box}
  .font-display{font-family:var(--font-display)!important}
  body{background:#050505;color:#fafafa;overflow-x:hidden;min-height:100vh}
  .glass{background:rgba(15,15,18,0.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.05)}
  @keyframes shimmer{0%{transform:translateX(-150%)skewX(-20deg)}100%{transform:translateX(200%)skewX(-20deg)}}
  .animate-shimmer{position:absolute;top:0;left:0;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shimmer 2.5s infinite;z-index:10}
  .cursor-blink{animation:blink 1s step-end infinite}
  @keyframes blink{50%{border-color:transparent}}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:#050505}
  ::-webkit-scrollbar-thumb{background:#18181b;border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:#27272a}
  .animate-scale-in{animation:scaleIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards;opacity:0;transform:scale(0.95)}
  @keyframes scaleIn{to{opacity:1;transform:scale(1)}}
  .animate-blob{animation:blob 15s infinite alternate cubic-bezier(0.4,0,0.2,1)}
  @keyframes blob{0%{transform:translate(0,0)scale(1)rotate(0deg)}33%{transform:translate(40px,-60px)scale(1.1)rotate(10deg)}66%{transform:translate(-30px,30px)scale(0.9)rotate(-10deg)}100%{transform:translate(0,0)scale(1)rotate(0deg)}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .fade-in-up{animation:fadeInUp 0.6s ease-out forwards}
  .video-container{position:relative;width:100%;background:#000;border-radius:1.5rem;overflow:hidden}
  .video-container video{width:100%;height:auto;max-height:70vh;object-fit:contain}
  .resolution-badge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;color:#fbbf24;border:1px solid rgba(251,191,36,0.3);z-index:20}
  .quality-selector{position:absolute;bottom:60px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:30}
  .quality-btn{background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);color:white;padding:6px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s}
  .quality-btn:hover,.quality-btn.active{background:#fbbf24;color:black;border-color:#fbbf24}
  .video-controls-overlay{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,0.8));opacity:0;transition:opacity 0.3s}
  .video-container:hover .video-controls-overlay,.video-container.show-controls .video-controls-overlay{opacity:1}
  .progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;cursor:pointer;margin-bottom:10px;position:relative}
  .progress-fill{height:100%;background:#fbbf24;border-radius:2px;transition:width 0.1s}
  .progress-handle{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:#fbbf24;border-radius:50%;opacity:0;transition:opacity 0.2s}
  .progress-bar:hover .progress-handle{opacity:1}
  .control-btn{background:none;border:none;color:white;cursor:pointer;padding:8px;border-radius:50%;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
  .control-btn:hover{background:rgba(255,255,255,0.1)}
  .time-display{font-size:12px;color:rgba(255,255,255,0.7);font-family:var(--font-display)}
  .fullscreen-btn{margin-left:auto}
  .volume-slider{width:80px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;cursor:pointer;appearance:none;-webkit-appearance:none}
  .volume-slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:12px;background:#fbbf24;border-radius:50%;cursor:pointer}
  .file-card{transition:all 0.4s cubic-bezier(0.16,1,0.3,1)}
  .file-card:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(0,0,0,0.4)}
  .dropzone-active{border-color:#fbbf24!important;background:rgba(251,191,36,0.05)!important}
  .upload-progress{transition:width 0.3s ease}
  .toast-enter{animation:toastIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)scale(0.95)}to{opacity:1;transform:translate(-50%,0)scale(1)}}
  .modal-backdrop{background:rgba(0,0,0,0.85);backdrop-filter:blur(20px)}
  .electric-border{position:relative;overflow:hidden}
  .electric-border::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:250%;height:250%;background:conic-gradient(from 0deg,transparent 70%,#fbbf24 100%);animation:spin 4s linear infinite;z-index:0}
  .electric-border::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:250%;height:250%;background:conic-gradient(from 0deg,transparent 60%,#fbbf24 100%);animation:spin 4s linear infinite;z-index:0;filter:blur(20px);opacity:0.6}
  .electric-inner{position:relative;z-index:1;background:#0a0a0c}
  .loading-spinner{width:40px;height:40px;border:3px solid rgba(251,191,36,0.2);border-top-color:#fbbf24;border-radius:50%;animation:spin 1s linear infinite}
  .media-preview-img{transition:transform 0.7s cubic-bezier(0.16,1,0.3,1)}
  .file-card:hover .media-preview-img{transform:scale(1.1)}
  .play-overlay{transition:all 0.3s cubic-bezier(0.16,1,0.3,1)}
  .file-card:hover .play-overlay{transform:scale(1.1);background:#fbbf24!important;color:black!important}
  .sidebar-nav-item{transition:all 0.3s cubic-bezier(0.16,1,0.3,1);border-radius:1rem;padding:1rem 1.25rem;display:flex;align-items:center;gap:0.875rem;font-weight:600;font-family:var(--font-display);letter-spacing:0.025em;width:100%;border:none;background:transparent;color:inherit;cursor:pointer}
  .sidebar-nav-item:hover{background:rgba(255,255,255,0.05);color:white}
  .sidebar-nav-item.active{background:#fbbf24;color:black;box-shadow:0 0 24px rgba(251,191,36,0.15)}
  .btn-primary{background:#fbbf24;color:black;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);border:none;cursor:pointer;font-family:var(--font-display);font-weight:800;letter-spacing:0.05em;text-transform:uppercase}
  .btn-primary:hover{transform:scale(1.02);box-shadow:0 0 20px rgba(251,191,36,0.3)}
  .btn-primary:active{transform:scale(0.98)}
  .input-field{background:rgba(0,0,0,0.5);border:1px solid #27272a;transition:all 0.3s;color:white;padding:1rem 1rem 1rem 3rem;border-radius:1rem;font-family:var(--font-display);font-weight:700;letter-spacing:0.02em;width:100%}
  .input-field:focus{outline:none;border-color:rgba(251,191,36,0.5);background:rgba(39,39,42,0.5)}
  .input-field::placeholder{color:#52525b}
  .stat-card{transition:all 0.3s cubic-bezier(0.16,1,0.3,1)}
  .stat-card:hover{transform:scale(1.02) translateY(-4px)}
  .copy-btn{transition:all 0.2s}
  .copy-btn:hover{transform:scale(1.05)}
  .copy-btn:active{transform:scale(0.95)}
  .delete-btn{transition:all 0.2s}
  .delete-btn:hover{background:#ef4444!important;color:white!important}
  .link-input{font-family:var(--font-display);letter-spacing:0.02em}
  .grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
  .upload-area{padding:4rem 2rem}
  @media(max-width:1024px){
    .sidebar{width:100%!important;position:fixed;bottom:0;left:0;z-index:100;flex-direction:row!important;padding:12px!important;gap:8px!important;border-right:none!important;border-top:1px solid rgba(255,255,255,0.05)}
    .sidebar-nav{flex-direction:row!important;flex:1;justify-content:center}
    .main-content{padding-bottom:100px!important;padding-left:24px!important;padding-right:24px!important}
    .sidebar-brand,.sidebar-status,.sidebar-logout{display:none}
    .stats-grid{grid-template-columns:1fr!important}
  }
  @media(max-width:768px){
    .grid-files{grid-template-columns:1fr!important}
    .upload-area{padding:40px 20px!important}
    .modal-content{max-width:95vw!important;border-radius:1rem!important}
    h1{font-size:2.5rem!important}
    h2{font-size:2rem!important}
  }
  .search-input{background:rgba(0,0,0,0.3);border:1px solid #27272a;border-radius:1rem;padding:0.75rem 1rem 0.75rem 2.5rem;color:white;font-size:0.875rem;transition:all 0.3s;width:100%}
  .search-input:focus{outline:none;border-color:rgba(251,191,36,0.4);background:rgba(0,0,0,0.5)}
  .search-input::placeholder{color:#52525b}
  .filter-btn{padding:0.5rem 1rem;border-radius:0.75rem;font-size:0.75rem;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.05em;border:1px solid #27272a;background:transparent;color:#a1a1aa;cursor:pointer;transition:all 0.2s}
  .filter-btn:hover,.filter-btn.active{background:#fbbf24;color:black;border-color:#fbbf24}
  .view-toggle-btn{padding:0.5rem;border-radius:0.5rem;border:1px solid #27272a;background:transparent;color:#a1a1aa;cursor:pointer;transition:all 0.2s}
  .view-toggle-btn:hover,.view-toggle-btn.active{background:rgba(255,255,255,0.1);color:white}
  .list-item{transition:all 0.3s}
  .list-item:hover{background:rgba(255,255,255,0.03)}
  .badge-type{font-size:10px;font-weight:800;font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.1em;padding:4px 10px;border-radius:6px}
  .badge-image{background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3)}
  .badge-video{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
  .badge-audio{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
  .badge-file{background:rgba(161,161,170,0.15);color:#a1a1aa;border:1px solid rgba(161,161,170,0.3)}
  .img-viewer-zoom{transition:transform 0.3s cubic-bezier(0.16,1,0.3,1)}
  .drag-over-overlay{position:absolute;inset:0;background:rgba(251,191,36,0.1);border:2px dashed #fbbf24;border-radius:inherit;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .drag-over-overlay span{color:#fbbf24;font-family:var(--font-display);font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:0.1em}
</style>
</head>

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [currentUser, setCurrentUser] = useState(localStorage.getItem('ins_username') || '');
  const [files, setFiles] = useState(JSON.parse(localStorage.getItem('ins_unlimited') || '[]'));
  const [showLoginModal, setShowLoginModal] = useState(false);
  const [inputUsername, setInputUsername] = useState('');
  const [pendingTab, setPendingTab] = useState('');
  const [uploadState, setUploadState] = useState('idle');
  const [uploadProgress, setUploadProgress] = useState(0);
  const [selectedFile, setSelectedFile] = useState(null);
  const [uploadedUrls, setUploadedUrls] = useState({ public: '', fix: '' });
  const [toast, setToast] = useState({ show: false, msg: '' });
  const [activeMedia, setActiveMedia] = useState(null);
  const [isLoading, setIsLoading] = useState(false);
  const [viewMode, setViewMode] = useState('grid');
  const [searchQuery, setSearchQuery] = useState('');
  const [filterType, setFilterType] = useState('all');
  const [isDragOver, setIsDragOver] = useState(false);
  const fileInputRef = useRef(null);
  const dropzoneRef = useRef(null);

  useEffect(() => {
    if (currentUser) syncWithServer();
    const hash = window.location.hash.slice(1);
    if (['dashboard', 'upload', 'history'].includes(hash)) setActiveTab(hash);
  }, [currentUser]);

  useEffect(() => {
    const dz = dropzoneRef.current;
    if (!dz) return;
    const handleDragOver = (e) => { e.preventDefault(); setIsDragOver(true); };
    const handleDragLeave = (e) => { e.preventDefault(); setIsDragOver(false); };
    const handleDrop = (e) => {
      e.preventDefault();
      setIsDragOver(false);
      if (e.dataTransfer.files.length > 0) {
        setSelectedFile(e.dataTransfer.files[0]);
        setUploadState('selected');
      }
    };
    dz.addEventListener('dragover', handleDragOver);
    dz.addEventListener('dragleave', handleDragLeave);
    dz.addEventListener('drop', handleDrop);
    return () => {
      dz.removeEventListener('dragover', handleDragOver);
      dz.removeEventListener('dragleave', handleDragLeave);
      dz.removeEventListener('drop', handleDrop);
    };
  }, [activeTab]);

  const syncWithServer = async () => {
    if (!currentUser) return;
    setIsLoading(true);
    try {
      const res = await fetch(`${API_BASE}/${currentUser}.json`);
      if (res.ok) {
        const json = await res.json();
        const serverFiles = (json.files || []).map(f => ({
          id: f.id,
          name: f.original_name || f.name,
          url: f.fix_url || f.user_media_url || `${window.location.origin}/${currentUser}/media/${encodeURIComponent(f.original_name || f.name)}`,
          rawUrl: f.url || f.public_url,
          size: f.file_size || f.size || 0,
          type: f.mime_type || f.type || 'application/octet-stream',
          uploaded_at: f.uploaded_at,
          file_type: f.file_type,
          evo_data: f.evo_data
        }));
        setFiles(serverFiles);
        localStorage.setItem('ins_unlimited', JSON.stringify(serverFiles));
      }
    } catch (e) {
      console.error("Sync error:", e);
      showToast("Gagal sinkronisasi dengan server");
    } finally {
      setIsLoading(false);
    }
  };

  const showToast = (msg) => {
    setToast({ show: true, msg });
    setTimeout(() => setToast({ show: false, msg: '' }), 2500);
  };

  const copyToClipboard = (text) => {
    navigator.clipboard.writeText(text);
    showToast("Link Tersalin!");
  };

  const handleTabSwitch = (tab) => {
    if (tab === 'upload' && !currentUser) {
      setPendingTab(tab);
      setShowLoginModal(true);
      return;
    }
    setActiveTab(tab);
    window.location.hash = tab;
  };

  const handleLoginSubmit = (e) => {
    e.preventDefault();
    if (inputUsername.trim()) {
      const u = inputUsername.trim().toLowerCase();
      setCurrentUser(u);
      localStorage.setItem('ins_username', u);
      setShowLoginModal(false);
      if (pendingTab) {
        setActiveTab(pendingTab);
        window.location.hash = pendingTab;
        setPendingTab('');
      }
    }
  };

  const handleLogout = () => {
    setCurrentUser('');
    setFiles([]);
    localStorage.removeItem('ins_username');
    localStorage.removeItem('ins_unlimited');
    setActiveTab('dashboard');
    window.location.hash = 'dashboard';
    showToast("Berhasil logout");
  };

  const handleFileSelect = (e) => {
    if (e.target.files.length > 0) {
      setSelectedFile(e.target.files[0]);
      setUploadState('selected');
    }
  };

  const startUpload = () => {
    if (!selectedFile || !currentUser) return;
    setUploadState('uploading');
    const formData = new FormData();
    formData.append("file", selectedFile);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${API_BASE}/upload-send`);
    xhr.setRequestHeader("x-user-id", currentUser);
    xhr.setRequestHeader("x-filename", selectedFile.name);

    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable) setUploadProgress(Math.round((ev.loaded / ev.total) * 100));
    };

    xhr.onload = async () => {
      if (xhr.status === 200) {
        try {
          const res = JSON.parse(xhr.responseText);
          if (res.success) {
            await syncWithServer();
            setUploadedUrls({
              public: res.public_url || res.url,
              fix: res.fix_url || res.user_media_url
            });
            setUploadState('success');
            showToast("File Berhasil Disimpan!");
          } else {
            throw new Error(res.error || "Upload gagal");
          }
        } catch (err) {
          setUploadState('idle');
          showToast(err.message || "Gagal mengunggah file");
        }
      } else {
        setUploadState('idle');
        showToast("Gagal mengunggah file");
      }
    };
    xhr.onerror = () => { setUploadState('idle'); showToast("Terjadi kesalahan jaringan"); };
    xhr.send(formData);
  };

  const deleteFile = async (fileId) => {
    const updated = files.filter(f => f.id !== fileId);
    setFiles(updated);
    localStorage.setItem('ins_unlimited', JSON.stringify(updated));
    showToast("File dihapus dari cache lokal");
  };

  const formatSize = (b) => {
    if (!b || b === 0) return '0 B';
    const i = Math.floor(Math.log(b) / Math.log(1024));
    return (b / Math.pow(1024, i)).toFixed(1) + ' ' + ['B','KB','MB','GB'][i];
  };

  const formatDate = (dateStr) => {
    if (!dateStr) return '-';
    const d = new Date(dateStr);
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  };

  const clearHistory = () => {
    if (window.confirm('Hapus cache data lokal? Data di server CloudFlare tetap aman.')) {
      setFiles([]);
      localStorage.setItem('ins_unlimited', '[]');
      showToast('Cache dibersihkan');
    }
  };

  const isVideo = (mime) => mime?.startsWith('video/');
  const isImage = (mime) => mime?.startsWith('image/');
  const isAudio = (mime) => mime?.startsWith('audio/');

  const totalSize = files.reduce((acc, f) => acc + (f.size || 0), 0);

  const filteredFiles = files.filter(f => {
    const matchesSearch = (f.name || '').toLowerCase().includes(searchQuery.toLowerCase());
    const matchesType = filterType === 'all' || f.file_type === filterType;
    return matchesSearch && matchesType;
  });

  // Custom Video Player
  const CustomVideoPlayer = ({ file, onClose }) => {
    const videoRef = useRef(null);
    const containerRef = useRef(null);
    const [isPlaying, setIsPlaying] = useState(false);
    const [currentTime, setCurrentTime] = useState(0);
    const [duration, setDuration] = useState(0);
    const [volume, setVolume] = useState(1);
    const [isMuted, setIsMuted] = useState(false);
    const [isFullscreen, setIsFullscreen] = useState(false);
    const [showControls, setShowControls] = useState(true);
    const [playbackRate, setPlaybackRate] = useState(1);
    const [buffered, setBuffered] = useState(0);
    const controlsTimeoutRef = useRef(null);
    const [isDragging, setIsDragging] = useState(false);

    useEffect(() => {
      const video = videoRef.current;
      if (!video) return;
      const updateTime = () => setCurrentTime(video.currentTime);
      const updateDuration = () => setDuration(video.duration);
      const updateBuffered = () => {
        if (video.buffered.length > 0) setBuffered(video.buffered.end(video.buffered.length - 1));
      };
      const onEnded = () => setIsPlaying(false);
      video.addEventListener('timeupdate', updateTime);
      video.addEventListener('loadedmetadata', updateDuration);
      video.addEventListener('progress', updateBuffered);
      video.addEventListener('ended', onEnded);
      return () => {
        video.removeEventListener('timeupdate', updateTime);
        video.removeEventListener('loadedmetadata', updateDuration);
        video.removeEventListener('progress', updateBuffered);
        video.removeEventListener('ended', onEnded);
      };
    }, []);

    const togglePlay = () => {
      const video = videoRef.current;
      if (!video) return;
      if (video.paused) { video.play(); setIsPlaying(true); }
      else { video.pause(); setIsPlaying(false); }
    };

    const handleSeek = (e) => {
      const video = videoRef.current;
      if (!video || !duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * duration;
    };

    const handleSeekStart = () => { setIsDragging(true); };
    const handleSeekEnd = () => { setIsDragging(false); };

    const toggleMute = () => {
      const video = videoRef.current;
      if (!video) return;
      video.muted = !video.muted;
      setIsMuted(video.muted);
    };

    const handleVolumeChange = (e) => {
      const video = videoRef.current;
      if (!video) return;
      const val = parseFloat(e.target.value);
      video.volume = val;
      setVolume(val);
      if (val > 0 && video.muted) { video.muted = false; setIsMuted(false); }
    };

    const toggleFullscreen = () => {
      const container = containerRef.current;
      if (!container) return;
      if (!document.fullscreenElement) {
        container.requestFullscreen().then(() => setIsFullscreen(true)).catch(() => {});
      } else {
        document.exitFullscreen().then(() => setIsFullscreen(false)).catch(() => {});
      }
    };

    const handleMouseMove = () => {
      setShowControls(true);
      if (controlsTimeoutRef.current) clearTimeout(controlsTimeoutRef.current);
      controlsTimeoutRef.current = setTimeout(() => { if (isPlaying) setShowControls(false); }, 3000);
    };

    const formatTime = (seconds) => {
      if (!seconds || isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    };

    const changePlaybackRate = () => {
      const rates = [0.5, 0.75, 1, 1.25, 1.5, 2];
      const currentIdx = rates.indexOf(playbackRate);
      const nextRate = rates[(currentIdx + 1) % rates.length];
      const video = videoRef.current;
      if (video) video.playbackRate = nextRate;
      setPlaybackRate(nextRate);
    };

    const skip = (seconds) => {
      const video = videoRef.current;
      if (!video) return;
      video.currentTime = Math.max(0, Math.min(video.currentTime + seconds, duration));
    };

    return (
      <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 modal-backdrop animate-scale-in" onClick={onClose}>
        <div ref={containerRef} className="relative w-full max-w-6xl bg-black rounded-[2.5rem] overflow-hidden shadow-[0_0_80px_rgba(251,191,36,0.1)] border border-white/10" onClick={(e) => e.stopPropagation()} onMouseMove={handleMouseMove}>
          <div className="video-container" style={{ borderRadius: '2.5rem' }}>
            <video
              ref={videoRef}
              src={file.url}
              className="w-full"
              style={{ maxHeight: '70vh', objectFit: 'contain' }}
              onClick={togglePlay}
              preload="metadata"
              playsInline
            />
            <div className="resolution-badge">{formatSize(file.size)} • {file.type?.split('/')[1]?.toUpperCase() || 'VIDEO'}</div>

            <div className={`video-controls-overlay ${showControls ? 'show-controls' : ''}`} style={{ opacity: showControls ? 1 : 0 }}>
              <div className="progress-bar" onClick={handleSeek} onMouseDown={handleSeekStart} onMouseUp={handleSeekEnd}>
                <div className="progress-fill" style={{ width: `${duration ? (currentTime / duration) * 100 : 0}%` }}></div>
                <div className="progress-handle" style={{ left: `${duration ? (currentTime / duration) * 100 : 0}%`, opacity: isDragging ? 1 : undefined }}></div>
              </div>

              <div className="flex items-center gap-4">
                <button className="control-btn" onClick={togglePlay}>
                  {isPlaying ? <I.Pause size={20} /> : <I.Play size={20} />}
                </button>
                <button className="control-btn" onClick={() => skip(-10)}>
                  <I.SkipBack size={18} />
                </button>
                <button className="control-btn" onClick={() => skip(10)}>
                  <I.SkipForward size={18} />
                </button>
                <button className="control-btn" onClick={toggleMute}>
                  {isMuted ? <I.VolumeX size={18} /> : <I.Volume2 size={18} />}
                </button>
                <input type="range" min="0" max="1" step="0.1" value={isMuted ? 0 : volume} onChange={handleVolumeChange} className="volume-slider" />
                <span className="time-display">{formatTime(currentTime)} / {formatTime(duration)}</span>
                <button className="control-btn" onClick={changePlaybackRate} style={{ fontSize: '11px', fontWeight: 'bold', fontFamily: 'var(--font-display)' }}>{playbackRate}x</button>
                <button className="control-btn fullscreen-btn" onClick={toggleFullscreen}>
                  {isFullscreen ? <I.Minimize size={18} /> : <I.Maximize size={18} />}
                </button>
              </div>
            </div>
          </div>

          <div className="absolute top-6 left-6 glass px-4 py-2 rounded-full text-sm text-zinc-300 font-display flex items-center gap-2">
            <I.Film size={14} className="text-amber-500" /> {file.name}
          </div>

          <button onClick={onClose} className="absolute top-6 right-6 p-3 bg-black/50 hover:bg-red-500 rounded-full text-white backdrop-blur-md transition-all border border-white/10 hover:border-transparent z-50">
            <I.X size={20} />
          </button>

          <div className="absolute bottom-6 right-6 flex gap-2">
            <button onClick={() => copyToClipboard(file.url)} className="p-3 bg-amber-500 rounded-xl text-black hover:scale-110 transition-all shadow-xl">
              <I.Copy size={16} />
            </button>
            <a href={file.url} download={file.name} className="p-3 bg-white rounded-xl text-black hover:scale-110 transition-all shadow-xl inline-flex">
              <I.Download size={16} />
            </a>
          </div>
        </div>
      </div>
    );
  };


  // Image Viewer with Zoom & Rotate
  const ImageViewer = ({ file, onClose }) => {
    const [scale, setScale] = useState(1);
    const [rotation, setRotation] = useState(0);
    const [position, setPosition] = useState({ x: 0, y: 0 });
    const [isDragging, setIsDragging] = useState(false);
    const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
    const imgRef = useRef(null);
    const containerRef = useRef(null);

    const zoomIn = () => setScale(s => Math.min(s + 0.25, 4));
    const zoomOut = () => setScale(s => Math.max(s - 0.25, 0.5));
    const rotate = () => setRotation(r => r + 90);
    const reset = () => { setScale(1); setRotation(0); setPosition({ x: 0, y: 0 }); };

    const handleMouseDown = (e) => {
      if (scale > 1) {
        setIsDragging(true);
        setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y });
      }
    };

    const handleMouseMove = (e) => {
      if (!isDragging) return;
      setPosition({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
    };

    const handleMouseUp = () => setIsDragging(false);

    return (
      <div className="fixed inset-0 z-[150] flex items-center justify-center p-6 modal-backdrop animate-scale-in" onClick={onClose}>
        <div ref={containerRef} className="relative max-w-6xl max-h-[90vh] rounded-[2.5rem] overflow-hidden shadow-[0_0_80px_rgba(251,191,36,0.1)] border border-white/10 bg-black/50 p-2" onClick={(e) => e.stopPropagation()}>
          <img
            ref={imgRef}
            src={file.url}
            className="max-w-full max-h-[85vh] object-contain rounded-[2rem] cursor-move"
            alt={file.name}
            style={{
              transform: `translate(${position.x}px, ${position.y}px) scale(${scale}) rotate(${rotation}deg)`,
              transition: isDragging ? 'none' : 'transform 0.3s cubic-bezier(0.16,1,0.3,1)'
            }}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            draggable={false}
          />
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-sm text-zinc-300 font-display flex items-center gap-4">
            <I.Image size={14} className="text-amber-500" />
            {file.name} &mdash; {formatSize(file.size)}
          </div>

  const AudioPlayer = ({ file, onClose }) => {
    const audioRef = useRef(null);
    const [isPlaying, setIsPlaying] = useState(false);
    const [currentTime, setCurrentTime] = useState(0);
    const [duration, setDuration] = useState(0);
    const [volume, setVolume] = useState(1);

    useEffect(() => {
      const audio = audioRef.current;
      if (!audio) return;
      const updateTime = () => setCurrentTime(audio.currentTime);
      const updateDuration = () => setDuration(audio.duration);
      audio.addEventListener('timeupdate', updateTime);
      audio.addEventListener('loadedmetadata', updateDuration);
      audio.addEventListener('ended', () => setIsPlaying(false));
      return () => {
        audio.removeEventListener('timeupdate', updateTime);
        audio.removeEventListener('loadedmetadata', updateDuration);
      };
    }, []);

    const togglePlay = () => {
      const audio = audioRef.current;
      if (!audio) return;
      if (audio.paused) { audio.play(); setIsPlaying(true); }
      else { audio.pause(); setIsPlaying(false); }
    };

    const handleSeek = (e) => {
      const audio = audioRef.current;
      if (!audio || !duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * duration;
    };

    const formatTime = (seconds) => {
      if (!seconds || isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    };

    return (
      <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 modal-backdrop animate-scale-in" onClick={onClose}>

              <div className="progress-fill" style={{ width: `${duration ? (currentTime / duration) * 100 : 0}%` }}></div>
            </div>
            <div className="flex justify-between text-xs text-zinc-500 font-display mb-4">
              <span>{formatTime(currentTime)}</span>
              <span>{formatTime(duration)}</span>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <button onClick={togglePlay} className="w-16 h-16 bg-amber-500 rounded-full flex items-center justify-center text-black hover:scale-110 transition-all shadow-xl shadow-amber-500/20">

    const [text, setText] = useState('');
    const [wordIndex, setWordIndex] = useState(0);
    const [isDeleting, setIsDeleting] = useState(false);
    useEffect(() => {
      const currentWord = words[wordIndex] || "";
      let timer;
      if (isDeleting) {
        timer = setTimeout(() => {
          setText(currentWord.substring(0, text.length - 1));
          if (text.length === 0) { setIsDeleting(false); setWordIndex((prev) => (prev + 1) % words.length); }
        }, deletingSpeed);
      } else {
        timer = setTimeout(() => {
          setText(currentWord.substring(0, text.length + 1));
          if (text.length === currentWord.length) setTimeout(() => setIsDeleting(true), delay);
        }, typingSpeed);
      }
      return () => clearTimeout(timer);
    }, [text, isDeleting, wordIndex, words, typingSpeed, deletingSpeed, delay]);
    return <span className="border-r-2 border-amber-500 pr-1 cursor-blink text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-600 font-display">{text}</span>;

                  </div>
                </div>

                <button onClick={() => { setUploadState('idle'); setSelectedFile(null); setUploadProgress(0); }} className="w-full max-w-md mx-auto mt-12 block bg-zinc-900 border border-zinc-800 text-white py-5 rounded-2xl font-display font-black text-sm uppercase hover:bg-white hover:text-black transition-all duration-300 active:scale-95 tracking-widest text-center">
                  Upload File Lainnya
                </button>
              </div>
            )}
          </section>
        )}


        {/* HISTORY / LIBRARY */}
        {activeTab === 'history' && (
          <section>
            <div className="flex flex-col sm:flex-row justify-between items-end sm:items-center gap-6 mb-12">
              <div className="flex items-center gap-5">
                <div className="w-14 h-14 bg-amber-500/10 rounded-2xl flex items-center justify-center border border-amber-500/20">
                  <I.FolderSearch size={28} className="text-amber-500" />
                </div>
                <div>
                  <h2 className="text-4xl lg:text-5xl font-display font-black tracking-tighter mb-1">My Library</h2>
                  <p className="text-zinc-400 font-medium text-lg">Semua media yang tersinkronisasi.</p>
                </div>
              </div>
              <div className="flex gap-3 flex-wrap">
                <div className="relative">
                  <I.Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                  <input type="text" placeholder="Cari file..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="search-input pl-9" />
                </div>
                {['all', 'image', 'video', 'audio', 'file'].map(t => (
                  <button key={t} onClick={() => setFilterType(t)} className={`filter-btn ${filterType === t ? 'active' : ''}`}>
                    {t === 'all' ? 'Semua' : t}
                  </button>
                ))}
                <button onClick={() => setViewMode(viewMode === 'grid' ? 'list' : 'grid')} className="view-toggle-btn active">
                  {viewMode === 'grid' ? <I.Grid3x3 size={16} /> : <I.List size={16} />}
                </button>
                <button onClick={syncWithServer} disabled={isLoading} className="flex items-center gap-2 text-amber-500 hover:text-amber-400 font-display font-bold text-[11px] transition-all uppercase tracking-[0.2em] bg-amber-500/10 px-6 py-3.5 rounded-full border border-amber-500/20 hover:border-amber-500/40">
                  <I.Loader size={16} className={isLoading ? 'animate-spin' : ''} /> {isLoading ? 'Syncing...' : 'Sync'}
                </button>
                <button onClick={clearHistory} className="flex items-center gap-2 text-zinc-500 hover:text-red-400 font-display font-bold text-[11px] transition-all uppercase tracking-[0.2em] bg-zinc-900/50 px-6 py-3.5 rounded-full border border-zinc-800 hover:border-red-500/30">
                  <I.ZapOff size={16} /> Bersihkan Cache
                </button>
              </div>
            </div>

            {filteredFiles.length > 0 ? (
              viewMode === 'grid' ? (
                <div className="grid-files">
                  {filteredFiles.map((file, idx) => (
                    <div key={file.id} className="file-card glass rounded-[2rem] p-5 flex flex-col group cursor-pointer relative overflow-hidden h-full"
                      onClick={() => setActiveMedia(file)}>
                      <div className="w-full h-44 bg-black rounded-2xl mb-5 overflow-hidden border border-zinc-800 flex items-center justify-center relative shadow-inner">
                        {isVideo(file.type) ? (
                          <>
                            <video src={file.url} className="w-full h-full object-cover opacity-60 group-hover:scale-105 group-hover:opacity-40 transition-all duration-700" preload="metadata" muted />
                            <div className="absolute w-14 h-14 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center group-hover:scale-110 transition-transform group-hover:bg-amber-500 text-white group-hover:text-black border border-white/10 group-hover:border-transparent play-overlay">
                              <I.Play size={24} className="ml-1 fill-current" />
                            </div>
                            <span className="absolute top-3 left-3 bg-black/80 px-2.5 py-1 rounded-md text-[10px] font-display font-bold text-white tracking-[0.2em] border border-white/10 backdrop-blur-md">VIDEO</span>
                            <FileBadge type="video" />
                          </>
                        ) : isImage(file.type) ? (
                          <img src={file.url} className="w-full h-full object-cover media-preview-img group-hover:opacity-50" alt={file.name} loading="lazy" />
                        ) : isAudio(file.type) ? (
                          <div className="flex flex-col items-center gap-2">
                            <div className="w-16 h-16 bg-amber-500/10 rounded-full flex items-center justify-center">
                              <I.Music size={32} className="text-amber-500" />
                            </div>
                            <span className="text-[10px] font-display font-bold text-zinc-500 uppercase tracking-widest">AUDIO</span>
                          </div>
                        ) : (
                          <I.FileText size={64} className="text-zinc-800 group-hover:text-amber-500 transition-colors" />
                        )}

                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-4 backdrop-blur-[2px]">
                          <button onClick={(e) => { e.stopPropagation(); copyToClipboard(file.url); }} className="p-3.5 bg-amber-500 rounded-xl text-black hover:scale-110 transition-all shadow-xl copy-btn">
                            <I.Copy size={20} />
                          </button>
                          <button onClick={(e) => { e.stopPropagation(); window.open(file.url, '_blank'); }} className="p-3.5 bg-white rounded-xl text-black hover:scale-110 transition-all shadow-xl">
                            <I.ExternalLink size={20} />
                          </button>
                          <button onClick={(e) => { e.stopPropagation(); deleteFile(file.id); }} className="p-3.5 bg-red-500 rounded-xl text-white hover:scale-110 transition-all shadow-xl delete-btn">
                            <I.Trash2 size={20} />
                          </button>
                        </div>
                      </div>

                      <h4 className="font-semibold text-sm truncate mb-2 px-1 text-zinc-200 group-hover:text-amber-400 transition-colors tracking-wide">{file.name}</h4>
                      <div className="flex items-center gap-2 text-[10px] text-zinc-600 mb-3 px-1">
                        <I.Clock size={12} />
                        <span>{formatDate(file.uploaded_at)}</span>
                      </div>
                      <div className="mt-auto flex justify-between items-center border-t border-zinc-800/50 pt-4 px-1">
                        <span className="text-[10px] font-display font-black text-zinc-500 uppercase tracking-widest bg-zinc-900/80 px-3 py-1.5 rounded-lg border border-zinc-800 group-hover:border-amber-500/30 transition-colors">{formatSize(file.size)}</span>
                        <I.CheckCircle2 size={20} className="text-amber-500 opacity-30 group-hover:opacity-100 transition-opacity" />
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="glass rounded-[2rem] overflow-hidden border border-zinc-800">
                  {filteredFiles.map((file) => (
                    <div key={file.id} className="list-item flex items-center gap-4 p-4 border-b border-zinc-800/50 cursor-pointer" onClick={() => setActiveMedia(file)}>
                      <div className="w-12 h-12 bg-black rounded-xl flex items-center justify-center border border-zinc-800 shrink-0">
                        {isVideo(file.type) ? <I.Film size={20} className="text-red-400" /> :
                         isImage(file.type) ? <I.Image size={20} className="text-blue-400" /> :
                         isAudio(file.type) ? <I.Music size={20} className="text-green-400" /> :
                         <I.FileText size={20} className="text-zinc-500" />}
                      </div>
                      <div className="flex-1 min-w-0">
                        <h4 className="font-semibold text-sm truncate text-zinc-200">{file.name}</h4>
                        <div className="flex items-center gap-3 text-[10px] text-zinc-500 mt-1">
                          <span>{formatSize(file.size)}</span>
                          <span>•</span>
                          <span>{formatDate(file.uploaded_at)}</span>
                          <FileBadge type={file.file_type || 'file'} />
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={(e) => { e.stopPropagation(); copyToClipboard(file.url); }} className="p-2 bg-zinc-800 rounded-lg text-zinc-400 hover:text-amber-500 transition-all">
                          <I.Copy size={16} />
                        </button>
                        <button onClick={(e) => { e.stopPropagation(); window.open(file.url, '_blank'); }} className="p-2 bg-zinc-800 rounded-lg text-zinc-400 hover:text-white transition-all">
                          <I.ExternalLink size={16} />
                        </button>
                        <button onClick={(e) => { e.stopPropagation(); deleteFile(file.id); }} className="p-2 bg-zinc-800 rounded-lg text-zinc-400 hover:text-red-500 transition-all delete-btn">
                          <I.Trash2 size={16} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )
            ) : (
              <div className="py-32 text-center glass rounded-[4rem] border border-zinc-900 relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-b from-zinc-900/20 to-transparent"></div>
                <div className="w-24 h-24 bg-black/50 backdrop-blur-md rounded-3xl flex items-center justify-center mx-auto mb-8 border border-zinc-800 relative z-10 shadow-inner">
                  <I.Inbox size={40} className="text-zinc-600" />
                </div>
                <h3 className="text-3xl font-display font-black text-zinc-500 uppercase tracking-tighter relative z-10">Library Kosong</h3>
                <p className="text-zinc-600 font-medium mt-3 text-lg relative z-10">Mulai unggah media pertama Anda ke cloud.</p>
              </div>
            )}
          </section>
        )}
      </main>

      {/* MEDIA MODALS */}
      {activeMedia && isImage(activeMedia.type) && (
        <ImageViewer file={activeMedia} onClose={() => setActiveMedia(null)} />
      )}

      {activeMedia && isVideo(activeMedia.type) && (
        <CustomVideoPlayer file={activeMedia} onClose={() => setActiveMedia(null)} />
      )}

      {activeMedia && isAudio(activeMedia.type) && (
        <AudioPlayer file={activeMedia} onClose={() => setActiveMedia(null)} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
