// Components
function Reveal({children,delay=0,className=''}){
  const [isVisible,setIsVisible]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const observer=new IntersectionObserver(([entry])=>{
      if(entry.isIntersecting){setIsVisible(true);observer.unobserve(entry.target)}
    },{threshold:0.1});
    if(ref.current)observer.observe(ref.current);
    return()=>{if(ref.current)observer.unobserve(ref.current)}
  },[]);
  return React.createElement('div',{ref,className:`transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] ${isVisible?'opacity-100 translate-y-0':'opacity-0 translate-y-8'} ${className}`,style:{transitionDelay:`${delay}s`}},children);
}

function ScrollReveal({children,className=''}){
  const [isVisible,setIsVisible]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const observer=new IntersectionObserver(([entry])=>{
      if(entry.isIntersecting){setIsVisible(true);observer.unobserve(entry.target)}
    },{threshold:0.2,rootMargin:'0px 0px -20px 0px'});
    if(ref.current)observer.observe(ref.current);
    return()=>{if(ref.current)observer.unobserve(ref.current)}
  },[]);
  return React.createElement('div',{ref,className:`transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] ${isVisible?'opacity-100 translate-y-0':'opacity-0 translate-y-6'} ${className}`},children);
}

function Typewriter({words,typingSpeed=100,deletingSpeed=50,delay=2000}){
  const [text,setText]=useState('');
  const [wordIndex,setWordIndex]=useState(0);
  const [isDeleting,setIsDeleting]=useState(false);
  useEffect(()=>{
    const currentWord=words[wordIndex]||'';
    let timer;
    if(isDeleting){
      timer=setTimeout(()=>{
        setText(currentWord.substring(0,text.length-1));
        if(text.length===0){setIsDeleting(false);setWordIndex((prev)=>(prev+1)%words.length)}
      },deletingSpeed);
    }else{
      timer=setTimeout(()=>{
        setText(currentWord.substring(0,text.length+1));
        if(text.length===currentWord.length)setTimeout(()=>setIsDeleting(true),delay);
      },typingSpeed);
    }
    return()=>clearTimeout(timer);
  },[text,isDeleting,wordIndex,words,typingSpeed,deletingSpeed,delay]);
  return React.createElement('span',{className:'border-r-2 border-amber-500 pr-1 cursor-blink text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-600 font-display'},text);
}

function ElectricBorder({children,color='#EAB308',speed=4,thickness=2,radius=24,className=''}){
  return React.createElement('div',{className:`electric-border ${className}`,style:{borderRadius:radius,padding:thickness}},
    React.createElement('div',{className:'electric-border-spin',style:{background:`conic-gradient(from 0deg,transparent 70%,${color} 100%)`,animation:`spin ${speed}s linear infinite`}}),
    React.createElement('div',{className:'electric-border-inner',style:{borderRadius:radius-thickness}},children)
  );
}

    const videoRef=useRef(null);
    const containerRef=useRef(null);
    const [isPlaying,setIsPlaying]=useState(false);
    const [currentTime,setCurrentTime]=useState(0);
    const [duration,setDuration]=useState(0);
    const [volume,setVolume]=useState(1);
    const [isMuted,setIsMuted]=useState(false);
    const [isFullscreen,setIsFullscreen]=useState(false);

    const [playbackRate,setPlaybackRate]=useState(1);
    const controlsTimeoutRef=useRef(null);

    useEffect(()=>{
      const video=videoRef.current;
      if(!video)return;
      const updateTime=()=>setCurrentTime(video.currentTime);
      const updateDuration=()=>setDuration(video.duration);
      const onEnded=()=>setIsPlaying(false);
      video.addEventListener('timeupdate',updateTime);
      video.addEventListener('loadedmetadata',updateDuration);
      video.addEventListener('ended',onEnded);
      return()=>{
        video.removeEventListener('timeupdate',updateTime);
        video.removeEventListener('loadedmetadata',updateDuration);

        if(controlsTimeoutRef.current)clearTimeout(controlsTimeoutRef.current);
      };
    },[]);

    const togglePlay=useCallback(()=>{
      const video=videoRef.current;
      if(!video)return;
      if(video.paused){video.play();setIsPlaying(true)}else{video.pause();setIsPlaying(false)}
    },[]);

    const handleSeek=useCallback((e)=>{
      const video=videoRef.current;
      if(!video||!duration)return;
      const rect=e.currentTarget.getBoundingClientRect();
      const pos=(e.clientX-rect.left)/rect.width;
      video.currentTime=pos*duration;
    },[duration]);

    const toggleMute=useCallback(()=>{
      const video=videoRef.current;
      if(!video)return;
      video.muted=!video.muted;
      setIsMuted(video.muted);
    },[]);

    const handleVolumeChange=useCallback((e)=>{
      const video=videoRef.current;
      if(!video)return;
      const val=parseFloat(e.target.value);
      video.volume=val;
      setVolume(val);
      if(val>0&&video.muted){video.muted=false;setIsMuted(false)}
    },[]);

    const toggleFullscreen=useCallback(()=>{
      const container=containerRef.current;
      if(!container)return;
      if(!document.fullscreenElement){

        document.exitFullscreen().then(()=>setIsFullscreen(false)).catch(()=>{});

    const handleMouseMove=useCallback(()=>{

    },[isPlaying]);
